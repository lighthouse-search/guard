name: Rust

on:
  push:
    branches: [ "main", "nightly", "cicd-changed" ]
  workflow_dispatch:

  # Callable by .github/workflows/auto-update.yml so scheduled dependency and
  # base-image refreshes reuse this exact build instead of duplicating it.
  workflow_call:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) to build. Defaults to the triggering commit."
        type: string
        required: false
        default: ""
      channel:
        description: "Release channel used for tagging and the prerelease flag. Defaults to the triggering branch."
        type: string
        required: false
        default: ""
      fresh-base-image:
        description: "Build the container image with no cache and a freshly pulled base image, so OS/apt security updates are picked up."
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

# Releases must not overlap: two runs racing here would compute the same next
# version. Queue them per channel instead of cancelling, so no build is dropped.
concurrency:
  group: release-${{ inputs.channel || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # On push/workflow_dispatch `inputs` is empty, so these fall back to the event.
  BUILD_REF: ${{ inputs.ref || github.sha }}
  CHANNEL: ${{ inputs.channel || github.ref_name }}
  # Where the incremented release.json is pushed. On push/dispatch that is the
  # branch that triggered the run; a caller passing `ref` must pass a BRANCH name
  # (not a SHA) so the bump has somewhere to land.
  VERSION_BRANCH: ${{ inputs.ref || github.ref_name }}

jobs:
  # Build the server frontend once; all platform jobs download this artifact.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: actions/setup-node@v7
        with:
          # Node 24: LTS through April 2028, and matches the node24 runtime the
          # actions themselves now use. Node 20 reached EOL on 2026-04-30 and
          # Node 22 is maintenance-only (EOL 2027-04-30).
          node-version: 24

      - name: Build server frontend
        run: |
          cd web
          npm install
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: server-frontend
          path: web/_static
          retention-days: 1

  # Build Rust binaries for each target platform.
  build:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-name: guard-linux-amd64
            use-cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact-name: guard-linux-arm64
            use-cross: true

          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   artifact-name: guard-darwin-arm64
          #   use-cross: false

          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   artifact-name: guard-windows-amd64
          #   use-cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux native (amd64) — system MySQL client + OpenSSL
      - name: Install system dependencies (Linux native)
        if: matrix.os == 'ubuntu-latest' && !matrix.use-cross
        run: sudo apt-get update -y && sudo apt-get install -y default-libmysqlclient-dev pkg-config libssl-dev

      # Linux arm64 — cross-compile via cross
      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # macOS — MySQL client via Homebrew
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mysql-client pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix mysql-client)/lib/pkgconfig" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix mysql-client)/lib" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$(brew --prefix mysql-client)/lib" >> $GITHUB_ENV

      # Windows — MySQL 8.0 and OpenSSL are pre-installed on windows-latest runners
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "MYSQLCLIENT_LIB_DIR=C:/Program Files/MySQL/MySQL Server 8.0/lib" >> $env:GITHUB_ENV
          echo "MYSQLCLIENT_VERSION=8.0" >> $env:GITHUB_ENV
          echo "OPENSSL_DIR=C:/Program Files/OpenSSL" >> $env:GITHUB_ENV

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}
        working-directory: server

      - name: Build (cargo)
        if: '!matrix.use-cross'
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: server

      - name: Run tests (native only)
        if: '!matrix.use-cross'
        run: cargo test --release --target ${{ matrix.target }}
        working-directory: server

      # Download the shared frontend artifact and package everything into a zip.
      - name: Download server frontend
        uses: actions/download-artifact@v8
        with:
          name: server-frontend
          path: release/frontend/_static

      - name: Copy example configs
        shell: bash
        run: |
          mkdir -p release/example
          cp example/email-config.toml release/example/
          cp example/oauth-config.toml release/example/

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cp server/target/${{ matrix.target }}/release/guard-server release/guard-server

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp server/target/${{ matrix.target }}/release/guard-server.exe release/guard-server.exe

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: zip -r ${{ matrix.artifact-name }}.zip release/
        shell: bash

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path release/* -DestinationPath ${{ matrix.artifact-name }}.zip
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.zip
          retention-days: 1

  # Create the GitHub release with all platform archives.
  #
  # release.json holds the last version published FROM MAIN, and only main ever
  # writes it. A main release increments it, publishes that version, and commits
  # the bump back.
  #
  # Every other channel publishes a prerelease of the upcoming version and does
  # NOT touch release.json — e.g. with the file at v0.1.4, nightly tags
  # v0.1.5-nightly.<run id>. That is deliberate: when both branches incremented
  # the same file they produced different values whenever one released more often
  # than the other, so release.json conflicted on every merge. Only one writer
  # means there is nothing to conflict.
  #
  # Versions are still never reused: main's tag is guarded below, and a
  # prerelease carries the run id, which is unique per run across the repo.
  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          # A token that can push the release.json bump back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(jq -r '.version' release.json)
          core=${current#v}
          if ! printf '%s' "$core" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release.json version '$current' is not v<major>.<minor>.<patch>, so it cannot be incremented."
            exit 1
          fi
          major=${core%%.*}; rest=${core#*.}; minor=${rest%%.*}; patch=${rest#*.}
          case "$current" in v*) prefix=v ;; *) prefix= ;; esac
          version="${prefix}${major}.${minor}.$((patch + 1))"

          # main publishes the bare version. Everything else publishes a semver
          # PRERELEASE of it — "$version-nightly.<run id>" sorts before $version,
          # which is correct for work heading toward that release. run_id (not
          # run_number) because it is unique across the whole repo: run_number is
          # per workflow, so a push-triggered run and a scheduled run could reach
          # the same number and collide.
          channel_slug=$(printf '%s' "$CHANNEL" | tr -c 'A-Za-z0-9' '-' | sed 's/-\+/-/g;s/^-//;s/-$//')
          if [ "$CHANNEL" = "main" ]; then
            tag="$version"
          else
            tag="$version-$channel_slug.${{ github.run_id }}"
          fi

          # Refuse to touch anything already published.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release '$tag' already exists. Previous releases are never overwritten; bump release.json or check for a stuck run."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag '$tag' already exists. Previous releases are never overwritten."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = "main" ]; then
            echo "Publishing $tag (release.json: $current -> $version)"
          else
            echo "Publishing prerelease $tag (release.json stays at $current; only main writes it)"
          fi

      # main only. Claim the version BEFORE publishing: if this push loses a race
      # the job stops here and no release is created, and if a later step fails we
      # have only burned a version number, which is harmless. Other channels skip
      # this entirely — they never write release.json, which is what keeps it
      # conflict-free across merges.
      - name: Record the new version in release.json
        if: env.CHANNEL == 'main'
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' release.json > release.json.new
          mv release.json.new release.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- release.json
          git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          git push origin "HEAD:refs/heads/$VERSION_BRANCH"

      - uses: actions/download-artifact@v8
        with:
          pattern: guard-*
          merge-multiple: true
          path: dist/

      - name: List dist
        run: ls -lh dist/

      # marvinpinto/action-automatic-releases was archived upstream in 2024 and is
      # pinned to node12, so it could not be brought onto node24 — this is the
      # maintained equivalent. It would update an existing release in place, which
      # is exactly what we must not do, so the version step above refuses to run
      # when the tag or release already exists.
      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ env.CHANNEL != 'main' }}
          name: Release ${{ steps.version.outputs.tag }}
          files: dist/*.zip

  # Docker image — built from the Linux amd64 binary.
  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: actions/download-artifact@v8
        with:
          name: guard-linux-amd64
          path: .

      - name: Unzip Linux amd64 artifact
        run: unzip guard-linux-amd64.zip

      # Taken from the release job rather than re-read from release.json, which by
      # now is one commit ahead of the ref this job checked out.
      - name: Get version
        run: echo "VERSION=${{ needs.release.outputs.version }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          # Discard the layer cache and re-pull ubuntu:24.04 so the Dockerfile's
          # `apt-get update && apt-get install` resolves against current packages.
          pull: ${{ inputs.fresh-base-image || false }}
          no-cache: ${{ inputs.fresh-base-image || false }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.CHANNEL == 'main' && env.VERSION || format('{0}-latest', env.CHANNEL) }}
            ghcr.io/${{ github.repository }}:${{ env.CHANNEL == 'main' && 'latest' || format('{0}-latest', env.CHANNEL) }}
