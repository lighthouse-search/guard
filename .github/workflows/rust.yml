name: Rust

on:
  push:
    branches: [ "main", "nightly", "cicd-changed" ]
  workflow_dispatch:
    inputs:
      containers-only:
        description: "Rebuild only the Linux container image: no macOS/Windows builds, no GitHub release. For iterating on the Dockerfile or refreshing the base OS."
        type: boolean
        required: false
        default: false
      fresh-base-image:
        description: "Build the container image with no cache and a freshly pulled base image, so OS/apt security updates are picked up."
        type: boolean
        required: false
        default: false

  # Callable by .github/workflows/auto-update.yml so scheduled dependency and
  # base-image refreshes reuse this exact build instead of duplicating it.
  workflow_call:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) to build. Defaults to the triggering commit."
        type: string
        required: false
        default: ""
      channel:
        description: "Release channel used for tagging and the prerelease flag. Defaults to the triggering branch."
        type: string
        required: false
        default: ""
      fresh-base-image:
        description: "Build the container image with no cache and a freshly pulled base image, so OS/apt security updates are picked up."
        type: boolean
        required: false
        default: false
      containers-only:
        description: "Rebuild only the Linux container image: no macOS/Windows builds, no GitHub release."
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

# Releases must not overlap: two runs racing here would compute the same next
# version. Queue them per channel instead of cancelling, so no build is dropped.
concurrency:
  group: release-${{ inputs.channel || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # On push/workflow_dispatch `inputs` is empty, so these fall back to the event.
  BUILD_REF: ${{ inputs.ref || github.sha }}
  CHANNEL: ${{ inputs.channel || github.ref_name }}
  # "true"/"false" as a string: `inputs` is empty on push, where this is false.
  CONTAINERS_ONLY: ${{ inputs.containers-only || false }}

jobs:
  # Build the server frontend once; all platform jobs download this artifact.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: actions/setup-node@v7
        with:
          # Node 24: LTS through April 2028, and matches the node24 runtime the
          # actions themselves now use. Node 20 reached EOL on 2026-04-30 and
          # Node 22 is maintenance-only (EOL 2027-04-30).
          node-version: 24

      - name: Build server frontend
        run: |
          cd web
          npm install
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: server-frontend
          path: web/_static
          retention-days: 1

  # Which platforms this run builds.
  #
  # Linux is always built: it is what the container image and most deployments
  # use, and the docker job below depends on it. macOS and Windows are built for
  # main only — they need dedicated runners (Windows arm64 a comparatively new
  # image), and they compile libmysqlclient and OpenSSL from source, so they cost
  # far more than the Linux jobs. That is worth spending on a release and not on
  # every nightly push.
  #
  # A containers-only run narrows this to linux-amd64, the single artifact the
  # docker job consumes.
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick build targets
        id: pick
        run: |
          # vendored: build with the `vendored` cargo feature, which compiles
          # libmysqlclient and OpenSSL from source, so the published binary needs
          # neither installed on the user's machine. Linux links the distro
          # package instead — that is what the container image installs, so its
          # security updates arrive with the base image.
          #
          # linux-amd64 pins ubuntu-26.04 rather than ubuntu-latest: it links the
          # distro libmysqlclient, so the soname it records has to be the one the
          # runtime image installs (26.04 -> libmysqlclient.so.24). Tracking
          # ubuntu-latest would silently re-link the binary when GitHub moves
          # that label — it is moving 24.04 -> 26.04 through November 2026 — and
          # the container would then die on a missing library. Keep this release
          # and server/Dockerfile's FROM in lockstep. It is also the glibc floor
          # for the published guard-linux-amd64 archive.
          # linux-arm64 builds inside cross's own container, which carries its
          # sysroot, so the runner image is irrelevant there.
          always='[
            {"os":"ubuntu-26.04","target":"x86_64-unknown-linux-gnu","artifact-name":"guard-linux-amd64","use-cross":false,"vendored":false},
            {"os":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","artifact-name":"guard-linux-arm64","use-cross":true,"vendored":false}
          ]'
          main_only='[
            {"os":"macos-latest","target":"aarch64-apple-darwin","artifact-name":"guard-darwin-arm64","use-cross":false,"vendored":true},
            {"os":"windows-latest","target":"x86_64-pc-windows-msvc","artifact-name":"guard-windows-amd64","use-cross":false,"vendored":true},
            {"os":"windows-11-arm","target":"aarch64-pc-windows-msvc","artifact-name":"guard-windows-arm64","use-cross":false,"vendored":true}
          ]'

          if [ "$CONTAINERS_ONLY" = "true" ]; then
            # Selected by name, not by index, so reordering `always` cannot
            # quietly turn this into a different target.
            matrix=$(jq -cn --argjson a "$always" \
              '{include: [$a[] | select(."artifact-name" == "guard-linux-amd64")]}')
          elif [ "$CHANNEL" = "main" ]; then
            matrix=$(jq -cn --argjson a "$always" --argjson b "$main_only" '{include: ($a + $b)}')
          else
            matrix=$(jq -cn --argjson a "$always" '{include: $a}')
          fi

          if [ "$(printf '%s' "$matrix" | jq '.include | length')" = "0" ]; then
            echo "::error::No build targets selected — the matrix would be empty."
            exit 1
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Channel '$CHANNEL' builds: $(printf '%s' "$matrix" | jq -r '[.include[]."artifact-name"] | join(", ")')"

  # Build Rust binaries for each target platform.
  build:
    needs: [build-frontend, targets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux native (amd64) — link the distro libmysqlclient. libssl-dev is for
      # that library's own linkage, not for Rust: nothing in the Linux dependency
      # tree uses openssl-sys (lettre and reqwest are both rustls).
      - name: Install system dependencies (Linux native)
        if: runner.os == 'Linux' && !matrix.use-cross
        run: sudo apt-get update -y && sudo apt-get install -y default-libmysqlclient-dev pkg-config libssl-dev

      # Linux arm64 — cross-compile via cross
      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # `--features vendored` compiles libmysqlclient and OpenSSL from source
      # rather than linking whatever the runner happens to have: these artifacts
      # are downloaded and run directly, so they must not require a MySQL client
      # or an OpenSSL on the user's machine. That needs cmake (MySQL) and perl
      # (OpenSSL); Windows additionally wants nasm for OpenSSL's assembly.
      #
      # All three ship on the hosted images today, so this normally just prints
      # versions. It installs rather than assumes because a missing tool here is
      # otherwise a confusing failure deep inside a build script.
      - name: Ensure native build tools
        if: matrix.vendored
        shell: bash
        run: |
          missing=""
          command -v cmake >/dev/null 2>&1 || missing="$missing cmake"
          command -v perl  >/dev/null 2>&1 || missing="$missing perl"
          if [ "${{ runner.os }}" = "Windows" ]; then
            command -v nasm >/dev/null 2>&1 || missing="$missing nasm"
          fi

          if [ -n "$missing" ]; then
            echo "Installing:$missing"
            case "${{ runner.os }}" in
              macOS)
                brew install $missing
                ;;
              Windows)
                for tool in $missing; do
                  case "$tool" in
                    cmake) choco install cmake --no-progress -y --installargs 'ADD_CMAKE_TO_PATH=System' ;;
                    perl)  choco install strawberryperl --no-progress -y ;;
                    nasm)  choco install nasm --no-progress -y ;;
                  esac
                done
                # choco's PATH edits do not reach the current shell.
                printf '%s\n' 'C:\Program Files\CMake\bin' 'C:\Strawberry\perl\bin' 'C:\Program Files\NASM' >> "$GITHUB_PATH"
                ;;
            esac
          fi

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}
        working-directory: server

      - name: Build (cargo)
        if: '!matrix.use-cross'
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.vendored && '--features vendored' || '' }}
        working-directory: server

      - name: Run tests (native only)
        if: '!matrix.use-cross'
        run: cargo test --release --target ${{ matrix.target }} ${{ matrix.vendored && '--features vendored' || '' }}
        working-directory: server

      # Download the shared frontend artifact and package everything into a zip.
      - name: Download server frontend
        uses: actions/download-artifact@v8
        with:
          name: server-frontend
          path: release/frontend/_static

      - name: Copy example configs
        shell: bash
        run: |
          mkdir -p release/example
          cp example/email-config.toml release/example/
          cp example/oauth-config.toml release/example/

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cp server/target/${{ matrix.target }}/release/guard-server release/guard-server

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp server/target/${{ matrix.target }}/release/guard-server.exe release/guard-server.exe

      # `cd release` first so the archive holds guard-server, frontend/ and
      # example/ at its root. Zipping `release/` instead would nest everything
      # one level down, which is both inconsistent with the Windows archive
      # below (Compress-Archive takes the contents) and with the layout the
      # makefile produces and the README documents.
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: cd release && zip -r ../${{ matrix.artifact-name }}.zip .
        shell: bash

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path release/* -DestinationPath ${{ matrix.artifact-name }}.zip
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.zip
          retention-days: 1

  # Create the GitHub release with all platform archives.
  #
  # The version counter is the set of release tags, not a file in the tree.
  #
  # A main release takes the highest plain vX.Y.Z tag, increments the patch, and
  # publishes that. Every other channel publishes a semver PRERELEASE of the same
  # upcoming version — with v0.1.4 released, nightly tags v0.1.5-nightly.<run id>
  # — and prereleases are filtered out when reading the counter, so only main
  # advances the release line.
  #
  # Nothing is committed back. An earlier design kept the counter in release.json
  # and pushed a bump to the release branch, which (a) conflicted on every merge
  # while both branches wrote it, and (b) cannot work at all once main requires
  # pull requests, since a workflow push is rejected by the ruleset and
  # GITHUB_TOKEN is not an eligible bypass actor. Tags have neither problem: they
  # are globally unique, never merge, and are not branch-protected.
  #
  # Versions are still never reused: main's tag is guarded below, and a
  # prerelease carries the run id, which is unique per run across the repo.
  #
  # Skipped entirely by a containers-only run: that path exists to rebuild an
  # image, and it must not burn a version or a tag doing so.
  release:
    needs: build
    if: ${{ inputs.containers-only != true }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          # Full history so the tags are present: they are what the next
          # version is derived from.
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The last plain release tag is the version counter. Prereleases
          # ("v0.1.7-nightly.42") are filtered out: they are published from
          # other channels and must not advance the release line.
          current=$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -1)
          # No releases yet, so the first one is v0.0.1.
          current=${current:-v0.0.0}

          core=${current#v}
          if ! printf '%s' "$core" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Latest release tag '$current' is not v<major>.<minor>.<patch>, so it cannot be incremented."
            exit 1
          fi
          major=${core%%.*}; rest=${core#*.}; minor=${rest%%.*}; patch=${rest#*.}
          version="v${major}.${minor}.$((patch + 1))"

          # main publishes the bare version. Everything else publishes a semver
          # PRERELEASE of it — "$version-nightly.<run id>" sorts before $version,
          # which is correct for work heading toward that release. run_id (not
          # run_number) because it is unique across the whole repo: run_number is
          # per workflow, so a push-triggered run and a scheduled run could reach
          # the same number and collide.
          channel_slug=$(printf '%s' "$CHANNEL" | tr -c 'A-Za-z0-9' '-' | sed 's/-\+/-/g;s/^-//;s/-$//')
          if [ "$CHANNEL" = "main" ]; then
            tag="$version"
          else
            tag="$version-$channel_slug.${{ github.run_id }}"
          fi

          # Refuse to touch anything already published.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release '$tag' already exists. Previous releases are never overwritten; check for a stuck run."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag '$tag' already exists. Previous releases are never overwritten."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = "main" ]; then
            echo "Publishing $tag (previous release: $current)"
          else
            echo "Publishing prerelease $tag of the upcoming $version (previous release: $current)"
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: guard-*
          merge-multiple: true
          path: dist/

      - name: List dist
        run: ls -lh dist/

      # marvinpinto/action-automatic-releases was archived upstream in 2024 and is
      # pinned to node12, so it could not be brought onto node24 — this is the
      # maintained equivalent. It would update an existing release in place, which
      # is exactly what we must not do, so the version step above refuses to run
      # when the tag or release already exists.
      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ env.CHANNEL != 'main' }}
          name: Release ${{ steps.version.outputs.tag }}
          files: dist/*.zip

  # Docker image — built from the Linux amd64 binary.
  #
  # `release` is skipped on a containers-only run, which by default would skip
  # this job with it; !cancelled() keeps it alive so the needs' results can be
  # checked by hand (and, unlike always(), still stops on a cancelled run).
  # build is a matrix, so its result is the aggregate of every platform — a
  # macOS failure still blocks the image, exactly as it did when this job hung
  # off release alone.
  docker:
    needs: [build, release]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: actions/download-artifact@v8
        with:
          name: guard-linux-amd64
          path: .

      # Extract into ./release, which is what the Dockerfile COPYs. The archive
      # holds guard-server, frontend/ and example/ at its root (so a user can
      # unzip and run it directly), and this job has already checked out the
      # repo — so extracting into the working directory would collide with the
      # repo's own example/, prompt for overwrite, and fail on EOF in CI.
      # -o: never prompt.
      - name: Unzip Linux amd64 artifact
        run: unzip -o guard-linux-amd64.zip -d release

      # The version comes from the release job, so the image carries exactly the
      # version that was published rather than one recomputed here.
      #
      # A containers-only run has no release and therefore no version: it only
      # moves the channel tag. It deliberately does not touch `latest` or a
      # vX.Y.Z tag — those name a published release, and nothing but a release
      # may repoint them. On main that means `main-latest`, which a full run
      # never writes, so the image under test is always distinguishable from
      # the released one.
      - name: Work out image tags
        id: tags
        run: |
          repo="ghcr.io/${{ github.repository }}"
          version="${{ needs.release.outputs.version }}"

          if [ "$CONTAINERS_ONLY" = "true" ]; then
            tags="$repo:$CHANNEL-latest"
          elif [ "$CHANNEL" = "main" ]; then
            if [ -z "$version" ]; then
              echo "::error::The release job produced no version, so the image cannot be tagged."
              exit 1
            fi
            tags=$(printf '%s\n%s' "$repo:$version" "$repo:latest")
          else
            tags="$repo:$CHANNEL-latest"
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Pushing:"
          printf '  %s\n' $tags

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          # Discard the layer cache and re-pull the base image so the
          # Dockerfile's `apt-get update && apt-get install` resolves against
          # current packages.
          pull: ${{ inputs.fresh-base-image || false }}
          no-cache: ${{ inputs.fresh-base-image || false }}
          tags: ${{ steps.tags.outputs.tags }}

      # The image build only proves the packages install. A soname mismatch
      # between the base image and the runner that linked the binary surfaces at
      # exec time, not build time, so check the linkage here: a red job beats a
      # container that crash-loops on first start. The image is already pushed by
      # the time this runs — on a containers-only run that is the point, the tag
      # is there to be inspected either way.
      - name: Verify the binary resolves in the image
        run: |
          image=$(printf '%s' "${{ steps.tags.outputs.tags }}" | head -1)
          docker pull "$image"

          # ldd prints "not found" against any dependency the base image lacks,
          # and exits 0 while doing it — hence the explicit grep.
          deps=$(docker run --rm --entrypoint ldd "$image" /builds/release/guard-server)
          printf '%s\n' "$deps"

          if printf '%s\n' "$deps" | grep -q 'not found'; then
            echo "::error::guard-server has unresolved shared libraries in the image. The Dockerfile's base image and the Ubuntu release the linux-amd64 job builds on are out of step — check libmysqlclient's soname in both."
            exit 1
          fi
