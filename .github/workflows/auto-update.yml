name: Auto update

# Keeps published releases and container images current with upstream changes:
#   * Rust crates          -> `cargo update` on every Cargo.toml in the repo
#   * npm packages         -> `npm update` on every package.json in the repo
#   * OS / apt packages    -> fresh `ubuntu:24.04` pull + cache-free image build
#
# It also audits every manifest for known advisories before and after the
# refresh and reports what the refresh could not fix. The case worth calling
# out is an advisory whose patched release is NOT a breaking change but is held
# back by an exact version pin: the lockfile never moves, so a lockfile-changed
# check alone would never notice it. Those appear in the run summary under
# "Non-breaking security fixes being held back".
#
# Versioning is owned entirely by rust.yml, which derives the next version from
# the release tags and publishes it. Nothing is committed back, so nothing here
# needs to account for a version bump.
#
# Nothing is merged into the target branch until the full build in rust.yml
# (compile + tests on every target, release, image push) has succeeded, so a
# dependency bump that does not build can never land on main.

on:
  schedule:
    # Mondays, 04:17 UTC. A cron run always executes the workflow file from the
    # DEFAULT branch, but the job below targets `nightly` — dependency bumps land
    # there first and reach main through the usual merge.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update and release from. Defaults to nightly."
        type: string
        required: false
        default: ""
      force:
        description: "Build and release even when no dependency or base image changed."
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write
  pull-requests: write

# One auto-update at a time, and never cancel one mid-release.
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  # Refresh every lockfile, work out whether anything actually moved, and park
  # the result on a throwaway staging branch for the build to validate.
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      target: ${{ steps.setup.outputs.target }}
      staging: ${{ steps.setup.outputs.staging }}
    steps:
      - name: Resolve target branch
        id: setup
        run: |
          # Default to nightly, NOT github.ref_name: a scheduled run reports the
          # default branch (main), which would release straight from main.
          target="${{ inputs.branch || 'nightly' }}"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "staging=auto-update/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.setup.outputs.target }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          # Node 24: LTS through April 2028, and matches the node24 runtime the
          # actions themselves now use. Node 20 reached EOL on 2026-04-30 and
          # Node 22 is maintenance-only (EOL 2027-04-30).
          node-version: 24

      # Moves transitive and in-range direct dependencies. Pinned exact
      # versions in Cargo.toml / package.json are deliberately left alone —
      # use Dependabot for those major bumps.
      # cargo-audit supplies the RustSec advisory data used by the audit steps.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies (before)
        run: python3 .github/scripts/dep_audit.py audit --out /tmp/audit-before.json

      # Moves transitive and in-range direct dependencies across every manifest
      # in the repo. Exact pins are left alone; the report below calls out any
      # pin that is holding back a non-breaking security fix.
      - name: Update all dependencies
        run: python3 .github/scripts/dep_audit.py update

      - name: Audit dependencies (after)
        run: python3 .github/scripts/dep_audit.py audit --out /tmp/audit-after.json

      - name: Security audit report
        id: audit
        run: |
          python3 .github/scripts/dep_audit.py report \
            /tmp/audit-before.json /tmp/audit-after.json \
            --summary /tmp/audit.md --github-output "$GITHUB_OUTPUT"
          cat /tmp/audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Flag security fixes blocked by exact pins
        if: steps.audit.outputs.blocked_count != '0'
        run: |
          echo "::warning::${{ steps.audit.outputs.blocked_count }} advisory(ies) have a non-breaking patched release that an exact version pin is holding back. See the run summary for the packages and which pins to relax."

      # The Dockerfile runs `apt-get update && apt-get install` at build time, so
      # OS updates arrive with a new base image digest. Record the digest so a
      # rebuilt image is only published when there is something new in it.
      - name: Check base image digests
        id: base
        run: |
          lock=.github/base-images.lock
          seeded=false
          [ -f "$lock" ] || seeded=true

          # `FROM --platform=linux/amd64 ubuntu:24.04 AS runtime` -> `ubuntu:24.04`
          images=$(sed -nE 's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]+//p' server/Dockerfile \
            | sed -E 's/(^|[[:space:]])--[^[:space:]]+//g' \
            | awk 'NF {print $1}' | sort -u)

          : > "$lock.new"
          for image in $images; do
            if ! digest=$(docker buildx imagetools inspect "$image" --format '{{ .Manifest.Digest }}' 2>&1); then
              echo "::error::could not resolve a digest for '$image': $digest"
              exit 1
            fi
            echo "$image $digest" >> "$lock.new"
            echo "$image -> $digest"
          done
          mv "$lock.new" "$lock"

          echo "seeded=$seeded" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        run: |
          deps=$(git status --porcelain -- '*Cargo.lock' '*package-lock.json')

          # A first run writes base-images.lock from scratch; that is a baseline,
          # not an update, so it must not trigger a release on its own.
          base=""
          if [ "${{ steps.base.outputs.seeded }}" != "true" ]; then
            base=$(git status --porcelain -- .github/base-images.lock)
          fi

          changed=false
          if [ -n "$deps$base" ] || [ "${{ inputs.force }}" = "true" ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          {
            echo "### Auto update"
            echo
            if [ "$changed" != "true" ]; then
              echo "Everything is already current — nothing to release."
            else
              [ -n "$deps" ] && echo "- Dependency lockfiles updated" || true
              [ -n "$base" ] && echo "- Container base image moved" || true
              [ "${{ inputs.force }}" = "true" ] && echo "- Forced rebuild requested" || true
            fi
            echo
            echo '```'
            git status --porcelain
            git --no-pager diff --stat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push staging branch
        id: commit
        if: steps.decide.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*Cargo.lock' '*package-lock.json' 2>/dev/null || true
          # release.json is deliberately absent: it is no longer a versioning
          # input at all — rust.yml derives the version from the release tags.
          [ -e .github/base-images.lock ] && git add -- .github/base-images.lock

          if git diff --cached --quiet; then
            # Only reachable via force with nothing to change. The build checks the
            # staging branch out by name, so it still has to exist — point it at the
            # target's current HEAD and release that as-is.
            echo "No changes to commit; releasing ${{ steps.setup.outputs.target }} as-is."
          else
            git commit -m "chore: auto-update dependencies" \
                       -m "Refreshed by the Auto update workflow (run ${{ github.run_id }})."
          fi

          git push origin "HEAD:refs/heads/${{ steps.setup.outputs.staging }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Full build, test, GitHub release and container image push, from the staged
  # commit. fresh-base-image forces an uncached image build on a re-pulled base
  # so the apt layer actually picks up OS updates.
  build:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/rust.yml
    with:
      ref: ${{ needs.refresh.outputs.staging }}
      channel: ${{ needs.refresh.outputs.target }}
      fresh-base-image: true

  # The build passed, so move the target branch onto the commit that produced
  # the release. If the branch is protected or has moved on, fall back to a PR.
  promote:
    needs: [refresh, build]
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward ${{ needs.refresh.outputs.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ needs.refresh.outputs.target }}
          STAGING: ${{ needs.refresh.outputs.staging }}
        run: |
          # Promote the staging branch's current tip rather than the SHA refresh
          # recorded. The build no longer adds commits — versioning comes from
          # tags — so in practice the tip equals the recorded SHA; reading it
          # back keeps this correct if that ever changes again.
          SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/$STAGING" --jq '.object.sha')
          if gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/$TARGET" \
               -f sha="$SHA" >/dev/null 2>gh.err; then
            echo "$TARGET now points at $SHA."
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$STAGING" >/dev/null || true
            echo "Merged into \`$TARGET\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat gh.err
          echo "::warning::Could not fast-forward $TARGET (branch protection, or it moved during the run). Opening a pull request instead."
          url=$(gh pr create --base "$TARGET" --head "$STAGING" \
            --title "chore: auto-update dependencies" \
            --body "Automated dependency and base-image refresh. The full build, tests, release and container image already passed on this commit in [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).")
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"

  # Build failed or was cancelled: drop the staging branch so it does not pile up.
  cleanup:
    needs: [refresh, build]
    if: always() && needs.refresh.outputs.changed == 'true' && needs.build.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delete staging branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/git/refs/heads/${{ needs.refresh.outputs.staging }}" >/dev/null || true
          echo "::warning::Build did not succeed; discarded the staged dependency update."
