[package]
name = "guard-server"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
diesel = { version = "2.2.3", features = ["mysql", "r2d2"] }
mysqlclient-sys = { version = "0.5" }
once_cell = "1.19.0"
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.117"
regex = "1.10.4"
ed25519-dalek = "2.1"
url = "2.5.0"
hex = "0.4"
hex-literal = "0.4.1"
toml = "0.8.12"
serde_urlencoded = "0.7.1"
# rustls, not lettre's default native-tls backend. native-tls was the only thing
# pulling openssl-sys into the tree, and openssl-sys >= 0.9.112 refuses to build
# against OpenSSL 1.0.2 — which is what the aarch64 `cross` image ships, so the
# arm64 release build failed on it. Using rustls drops openssl entirely (also
# removing its advisories) and matches the rest of Guard, which is rustls
# throughout: axum-server tls-rustls, reqwest rustls-tls, and the aws-lc-rs
# provider installed explicitly at startup in main.rs.
# Default features minus native-tls: smtp-transport, pool, hostname, builder.
lettre = { version = "0.11.7", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "rustls-tls"] }
reqwest = { version = "0.12.4", default-features = false, features = ["rustls-tls"] }
argon2 = "0.5.3"
base64 = "0.22.1"
indexmap = { version = "2.9.0", features = ["serde"] }
log = "0.4.27"
tokio = { version = "1.44.2", features = ["full"] }
env_logger = "0.11.8"
uuid = { version = "1.16.0", features = ["v4"] }
rand = "0.8.5"
sha2 = "0.11"
axum = { version = "0.8.8", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
# Both aws-lc-rs and ring end up in the tree (reqwest + axum-server), so rustls
# can't auto-pick a provider; we install aws-lc-rs explicitly at startup.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
axum-extra = { version = "0.12.5", features = ["cookie", "typed-header"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
hyper-util = { version = "0.1", features = ["client-legacy"] }

# Only pulled in by the `vendored` feature below; never used from our code.
# Declaring it is the way to turn on `vendored` for the openssl-sys that
# mysqlclient-src links against.
openssl-sys = { version = "0.9", optional = true }

[features]
# Compile libmysqlclient (and the OpenSSL it needs) from source rather than
# linking whatever is installed on the build machine.
#
# The published macOS and Windows binaries are built with this, because they are
# downloaded and run directly: they must not require a MySQL client library on
# the user's machine, and for Windows arm64 there is no prebuilt one to link
# against anyway.
#
# It is a feature rather than a target `cfg` so that local development on macOS
# keeps linking the system libmysqlclient (`brew install mysql-client`) — the
# vendored path needs cmake and compiles MySQL and OpenSSL from scratch, which
# is not something you want on every `cargo build`.
#
# Linux releases deliberately do NOT use this: the container image installs
# libmysqlclient21 from apt, so security updates arrive with the base image
# rather than needing a Guard rebuild.
vendored = ["mysqlclient-sys/bundled", "dep:openssl-sys", "openssl-sys/vendored"]
