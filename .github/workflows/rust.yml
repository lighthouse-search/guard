name: Rust

on:
  push:
    branches: [ "main", "nightly", "cicd-changed" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the server frontend once; all platform jobs download this artifact.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build server frontend
        run: |
          cd server/frontend
          npm install
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: server-frontend
          path: server/frontend/_static
          retention-days: 1

  # Build Rust binaries for each target platform.
  build:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-name: guard-linux-amd64
            use-cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact-name: guard-linux-arm64
            use-cross: true

          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   artifact-name: guard-darwin-arm64
          #   use-cross: false

          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   artifact-name: guard-windows-amd64
          #   use-cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux native (amd64) — system MySQL client + OpenSSL
      - name: Install system dependencies (Linux native)
        if: matrix.os == 'ubuntu-latest' && !matrix.use-cross
        run: sudo apt-get update -y && sudo apt-get install -y default-libmysqlclient-dev pkg-config libssl-dev

      # Linux arm64 — cross-compile via cross
      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # macOS — MySQL client via Homebrew
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mysql-client pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix mysql-client)/lib/pkgconfig" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix mysql-client)/lib" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$(brew --prefix mysql-client)/lib" >> $GITHUB_ENV

      # Windows — MySQL 8.0 and OpenSSL are pre-installed on windows-latest runners
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "MYSQLCLIENT_LIB_DIR=C:/Program Files/MySQL/MySQL Server 8.0/lib" >> $env:GITHUB_ENV
          echo "MYSQLCLIENT_VERSION=8.0" >> $env:GITHUB_ENV
          echo "OPENSSL_DIR=C:/Program Files/OpenSSL" >> $env:GITHUB_ENV

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}
        working-directory: server

      - name: Build (cargo)
        if: '!matrix.use-cross'
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: server

      - name: Run tests (native only)
        if: '!matrix.use-cross'
        run: cargo test --release --target ${{ matrix.target }}
        working-directory: server

      # Download the shared frontend artifact and package everything into a zip.
      - name: Download server frontend
        uses: actions/download-artifact@v4
        with:
          name: server-frontend
          path: release/frontend/_static

      - name: Copy example configs
        shell: bash
        run: |
          mkdir -p release/example
          cp example/email-config.toml release/example/
          cp example/oauth-config.toml release/example/

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cp server/target/${{ matrix.target }}/release/guard-server release/guard-server

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp server/target/${{ matrix.target }}/release/guard-server.exe release/guard-server.exe

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: zip -r ${{ matrix.artifact-name }}.zip release/
        shell: bash

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path release/* -DestinationPath ${{ matrix.artifact-name }}.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.zip
          retention-days: 1

  # Create the GitHub release with all platform archives.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: |
          sudo apt-get install -y jq
          echo "VERSION=$(jq -r '.version' release.json)" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          pattern: guard-*
          merge-multiple: true
          path: dist/

      - name: List dist
        run: ls -lh dist/

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ env.VERSION }}"
          prerelease: ${{ github.ref_name != 'main' }}
          title: Release ${{ env.VERSION }}
          files: dist/*.zip

  # Docker image — built from the Linux amd64 binary.
  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: guard-linux-amd64
          path: .

      - name: Unzip Linux amd64 artifact
        run: unzip guard-linux-amd64.zip

      - name: Get version
        run: |
          sudo apt-get install -y jq
          echo "VERSION=$(jq -r '.version' release.json)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name == 'main' && env.VERSION || format('{0}-latest', github.ref_name) }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name == 'main' && 'latest' || format('{0}-latest', github.ref_name) }}
